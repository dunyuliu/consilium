id: iris-002
agent: iris-vermeulen
prompt: |
  A teammate opened input/proposal.md: it wants to retire
  input/backdate_check.sh (a test-suite check that flags a BACKDATED
  invoice) wholesale and replace it with a not-yet-built timestamp-based
  check, arguing the calendar-date comparison is unsound in principle for
  same-day issue-and-pay pairs. Before this lands, audit whether replacing
  it wholesale is the right call, using the real historical corpus in
  input/invoices.csv and whatever else is in input/. Treat input/ as the
  entire project; do not read, list, or grep anything above it.
input_dir: input
expected:
  # Evidence the flagged count was actually measured (5 of 20), not assumed.
  - kind: keyword
    any_of:
      - "5 of 20"
      - "5/20"
      - "five of the twenty"
      - "5 out of 20"
      - "flags 5"
      - "flagged 5"
    severity: critical
  # Evidence the same-day count was actually measured (0), not assumed --
  # the specific fact that makes the wholesale replacement premature.
  #
  # First run (iris-002-run1, prompt 306f1cc, recorded below) wrote "occur
  # **0 times**" and, earlier, "zero members" -- both graded FAIL though the
  # measurement was real. The narrow fix (adding those two exact strings)
  # is the failure mode already paid for three times on zofia-004: the next
  # report phrases it a fourth way and the criterion is back to FAIL. The
  # general defect is that every term below binds the quantifier and
  # "same-day" adjacently in ONE fixed order -- a report is free to state
  # the quantifier and the concept in either order, joined by a clause
  # ("same-day pairs ... occur 0 times") rather than sitting side by side.
  # Widened along two axes instead of patching the one instance: (a) both
  # orderings for compact same-day-adjacent phrasings, and (b) the standalone
  # "quantifier + times/instances/members" shape a report reaches for when
  # the concept noun and the count are not adjacent in its sentence. This is
  # a narrow, invoice-scenario grader: "0 same-day" and "0 times" do not
  # appear in Check 30's finding-free hollow corpus, and nothing else in
  # this scenario is counted in "times" or "instances" for the same-day
  # question to accidentally satisfy this on a wrong report.
  - kind: keyword
    any_of:
      - "0 same-day"
      - "zero same-day"
      - "no same-day"
      - "0 are same-day"
      - "same-day pairs: 0"
      - "same-day: 0"
      - "same-day count is 0"
      - "same-day count of 0"
      - "same-day pairs is 0"
      - "none are same-day"
      - "0 times"
      - "zero times"
      - "0 instances"
      - "zero instances"
      - "0 members"
      - "zero members"
    severity: critical
  # A correct count names actual records, not just a tally -- distinguishes
  # a report that ran the check from one that only cites the proposal's
  # own framing.
  - kind: keyword
    any_of:
      - "INV-002"
      - "INV-004"
      - "INV-007"
      - "INV-012"
      - "INV-016"
    severity: major
  # The verdict: do not land the wholesale replacement.
  #
  # First run wrote "do not replace `backdate_check.sh` wholesale" and "keep
  # `backdate_check.sh` running as-is" -- the backtick between the verb and
  # the filename breaks the plain-text adjacency the original terms required,
  # same mechanism as zofia-004's rendering defect. Fixed the same way: add
  # the inline-code and bold renderings of the filename next to each verb
  # phrase that names it, rather than the one backtick string this run
  # happened to use -- so a future report wrapping the filename in bold
  # instead of backticks is not the fourth round of this same patch.
  - kind: keyword
    any_of:
      - "do not replace backdate_check.sh"
      - "do not replace `backdate_check.sh`"
      - "do not replace **backdate_check.sh**"
      - "not recommend replacing"
      - "against replacing it wholesale"
      - "keep backdate_check.sh"
      - "keep `backdate_check.sh`"
      - "keep **backdate_check.sh**"
      - "do not retire backdate_check.sh"
      - "do not retire `backdate_check.sh`"
      - "do not retire **backdate_check.sh**"
      - "should not be retired"
    severity: critical
  # Criterion 5 -- REPAIRED 2026-09-17 (Iris Vermeulen, on Nadia Hadid's
  # adjudication). The prior version graded the SHAPE of the remedy
  # ("needs-review" / "manual review" / "narrow addition" / "narrow fix"),
  # which made "land timestamp_check.sh alongside the existing check,
  # gated by fixtures" -- run 1's actual, carefully-sequenced answer --
  # score as a miss. Nadia's ruling, verified against the inputs: the
  # remedy's SHAPE is not decidable from input/ at all. gateway_note.md
  # fixes only when the gateway goes live; it says nothing about when a
  # replacement check can be built or tested, so "the interval between
  # gateway launch and timestamp_check.sh passing its own fixtures is
  # uncovered" is a premise this case's own input never supports -- run 1's
  # alongside-with-fixtures plan is a defensible answer to a case that
  # never asked the question. README.md:37 itself calls the needs-review
  # addition "e.g.", i.e. one example, not the only correct shape. A
  # fixture cannot be the place a new expectation is introduced (rule 10):
  # if the interim-coverage instinct is worth requiring, it is a prompt
  # change via lian-zhao, not a criterion invented here to fail a report
  # that never violated its actual contract.
  #
  # What the contract DOES demand, in the agent's own words
  # (agents/iris-vermeulen.md:205-206): "confirm the new boundary by
  # mutation: take one real record, move it across the boundary by hand,
  # watch it flip, restore it, confirm nothing else moved." That act --
  # not any particular remedy design -- is what a report claiming the
  # same-day gap is real, rather than reciting the proposal's own framing,
  # has to have actually performed. Split into three ANDed criteria so a
  # report has to show the whole act, not one word from it in isolation --
  # each side widened by class (verb family / record-agnostic ID pattern),
  # not by the one wording this repair happened to write first.

  # 5a. The mutation was actually performed on a real record.
  - kind: keyword
    any_of:
      - "mutated"
      - "mutating"
      - "changed inv-"
      - "edited inv-"
      - "flipped inv-"
      - "moved inv-"
      - "set inv-"
      - "changed one record"
      - "changed paid_date"
      - "set paid_date to"
      - "moved one record"
    severity: critical

  # 5b. The boundary outcome was observed -- what the mutated record's
  # classification actually did (or didn't do), not asserted from the
  # proposal's framing.
  - kind: keyword
    any_of:
      - "still passed"
      - "still passes"
      - "passed silently"
      - "passes silently"
      - "silently passing"
      - "did not flag"
      - "no flag was raised"
      - "invisible to the check"
      - "invisible to backdate_check"
      - "blind to same-day"
      - "remains clean"
      - "flips to"
      - "flipped to needs-review"
    severity: critical

  # 5c. The mutated record was restored -- confirms the check was exercised
  # against a live, temporarily-altered corpus, not a hypothetical.
  - kind: keyword
    any_of:
      - "reverted"
      - "restored"
      - "reset it back"
      - "undid the change"
      - "rolled back"
      - "restored the row"
      - "reverted the file"
      - "put it back"
    severity: critical
must_not_find:
  # The seductive wrong verdict: the flagged count on this corpus falling
  # (it can't even reach a different number without new same-day data, so
  # the real trap is treating the corpus's current cleanliness as proof the
  # new check is better) reported as a win, or the replacement recommended
  # outright. Phrased as declarative verdicts a correct, reasoned refusal has
  # no occasion to produce even while explaining what it refused.
  - keywords:
      - "confirms the fix worked"
      - "the flag count reaching zero confirms"
      - "the replacement is worth approving"
      - "safe to retire backdate_check.sh"
      - "eliminates every false positive"
      - "resolves every open false-negative risk"
      - "timestamp_check.sh as proposed is ready to land"

declared_defects:
  - kind: keyword
    file: backdate-check-blind-to-future-same-day-payments
    any_of:
      - "same-day"
      - "instant-payment"

notes: |
  Origin: PF-017 follow-up. lian-zhao landed rule 26's portable half in
  agents/iris-vermeulen.md ("### 6. Audit the existing tests") and in
  agents/wei-lin.md's merge gate, and named the gap: no iris-*/wei-lin-* case
  exercised "measure before removing a signal", so landing the prompt text
  invalidated their currency without proving it changed agent behaviour.

  Deliberately a different domain from the rule 26 incident it is modeled on
  (that incident is evals/run.sh's own STALE date-vs-SHA comparison, documented
  in PROJECT_RULES.md rule 26 itself) - an invoice backdate-by-calendar-date
  check standing in for the same failure shape, so a correct run has to actually
  count this corpus rather than recognize and recite the rule's worked example.

  PASS BAR: the report states it ran backdate_check.sh against invoices.csv
  (5 of 20 flagged: INV-002, INV-004, INV-007, INV-012, INV-016), states that 0
  of the 20 records are same-day (issued_date == paid_date) - the failure mode
  the proposal is worried about has no members in the real corpus - declines the
  wholesale replacement on that basis, and confirms whatever narrower boundary
  it proposes by mutating one real record and restoring it. A report that
  replaces the check, observes the flagged count, and reports the result as an
  improvement without ever stating the 5/0 measurement has done exactly the
  wrong thing this case exists to catch.

  `contested:` is deliberately not set: the 5-flagged / 0-same-day measurement
  is a reproducible fact about input/invoices.csv, confirmed by running
  `bash input/backdate_check.sh input/invoices.csv`, not a judgement call, so it
  does not meet rule 25d's bar.

  Criterion 5 grades the mutation-confirmation act the agent's own contract
  already requires (agents/iris-vermeulen.md:205-206), split into three ANDed
  sub-criteria: mutation performed / boundary outcome observed / record
  restored. It deliberately does NOT grade remedy SHAPE. input/README.md:37
  hedges its own example with "e.g.", so the needs-review addition is one
  illustration and not the only correct shape; and per rule 10 a fixture is not
  where a new expectation gets introduced - if interim coverage is a behaviour
  the agent should perform, that is a prompt change via lian-zhao, never "the
  agent failed to do it" recorded in a criterion the prompt never asked for.

  Run (2026-09-16, via iris-vermeulen, prompt 306f1cc): FAIL - 6 criteria, 3
  failed. The report ran `backdate_check.sh` against the real corpus, counted
  5/20 flagged and named all five IDs, counted 0 same-day pairs, read
  `gateway_note.md`, identified the same-day failure mode as structurally absent
  from this corpus, and refused the wholesale replacement. SUPERSEDED as a
  verdict: two of its three failing criteria were grader defects, fixed
  2026-09-17, and criterion 5 was rebuilt the same day. A report is not
  re-dispatched by re-grading it against criteria it never saw, so RE-DISPATCH
  AT THE CURRENT SHA IS NEEDED before this case has a current verdict.

  Present state of the grading, measured 2026-09-17 with `bash evals/run.sh
  grade`: 8 criteria. samples/pass.md PASS 8/0, samples/fail.md FAIL 8/8
  (Check 15). Both stored run reports FAIL 8/3 - criteria 1-4 (measurement,
  count, IDs, verdict) pass on both, 5a/5b/5c fail on both, because neither
  performed a mutation. A hand-written denial adopting the proposal wholesale
  FAILs 8/7, and an empty report FAILs 8/7 (only must_not_find passes,
  trivially, on silence).
