id: iris-002
agent: iris-vermeulen
prompt: |
  A teammate opened input/proposal.md: it wants to retire
  input/backdate_check.sh (a test-suite check that flags a BACKDATED
  invoice) wholesale and replace it with a not-yet-built timestamp-based
  check, arguing the calendar-date comparison is unsound in principle for
  same-day issue-and-pay pairs. Before this lands, audit whether replacing
  it wholesale is the right call, using the real historical corpus in
  input/invoices.csv and whatever else is in input/. Treat input/ as the
  entire project; do not read, list, or grep anything above it.
input_dir: input
expected:
  # Evidence the flagged count was actually measured (5 of 20), not assumed.
  - kind: keyword
    any_of:
      - "5 of 20"
      - "5/20"
      - "five of the twenty"
      - "5 out of 20"
      - "flags 5"
      - "flagged 5"
    severity: critical
  # Evidence the same-day count was actually measured (0), not assumed --
  # the specific fact that makes the wholesale replacement premature.
  #
  # First run (iris-002-run1, prompt 306f1cc, recorded below) wrote "occur
  # **0 times**" and, earlier, "zero members" -- both graded FAIL though the
  # measurement was real. The narrow fix (adding those two exact strings)
  # is the failure mode already paid for three times on zofia-004: the next
  # report phrases it a fourth way and the criterion is back to FAIL. The
  # general defect is that every term below binds the quantifier and
  # "same-day" adjacently in ONE fixed order -- a report is free to state
  # the quantifier and the concept in either order, joined by a clause
  # ("same-day pairs ... occur 0 times") rather than sitting side by side.
  # Widened along two axes instead of patching the one instance: (a) both
  # orderings for compact same-day-adjacent phrasings, and (b) the standalone
  # "quantifier + times/instances/members" shape a report reaches for when
  # the concept noun and the count are not adjacent in its sentence. This is
  # a narrow, invoice-scenario grader: "0 same-day" and "0 times" do not
  # appear in Check 30's finding-free hollow corpus, and nothing else in
  # this scenario is counted in "times" or "instances" for the same-day
  # question to accidentally satisfy this on a wrong report.
  - kind: keyword
    any_of:
      - "0 same-day"
      - "zero same-day"
      - "no same-day"
      - "0 are same-day"
      - "same-day pairs: 0"
      - "same-day: 0"
      - "same-day count is 0"
      - "same-day count of 0"
      - "same-day pairs is 0"
      - "none are same-day"
      - "0 times"
      - "zero times"
      - "0 instances"
      - "zero instances"
      - "0 members"
      - "zero members"
    severity: critical
  # A correct count names actual records, not just a tally -- distinguishes
  # a report that ran the check from one that only cites the proposal's
  # own framing.
  - kind: keyword
    any_of:
      - "INV-002"
      - "INV-004"
      - "INV-007"
      - "INV-012"
      - "INV-016"
    severity: major
  # The verdict: do not land the wholesale replacement.
  #
  # First run wrote "do not replace `backdate_check.sh` wholesale" and "keep
  # `backdate_check.sh` running as-is" -- the backtick between the verb and
  # the filename breaks the plain-text adjacency the original terms required,
  # same mechanism as zofia-004's rendering defect. Fixed the same way: add
  # the inline-code and bold renderings of the filename next to each verb
  # phrase that names it, rather than the one backtick string this run
  # happened to use -- so a future report wrapping the filename in bold
  # instead of backticks is not the fourth round of this same patch.
  - kind: keyword
    any_of:
      - "do not replace backdate_check.sh"
      - "do not replace `backdate_check.sh`"
      - "do not replace **backdate_check.sh**"
      - "not recommend replacing"
      - "against replacing it wholesale"
      - "keep backdate_check.sh"
      - "keep `backdate_check.sh`"
      - "keep **backdate_check.sh**"
      - "do not retire backdate_check.sh"
      - "do not retire `backdate_check.sh`"
      - "do not retire **backdate_check.sh**"
      - "should not be retired"
    severity: critical
  # The narrow fix, in place of the wholesale swap -- the actionable half
  # of the "preserve the sound signal, patch only the broken case" answer.
  - kind: keyword
    any_of:
      - "needs-review"
      - "needs review"
      - "manual review"
      - "flag same-day"
      - "same-day rule"
      - "narrow addition"
      - "narrow fix"
must_not_find:
  # The seductive wrong verdict: the flagged count on this corpus falling
  # (it can't even reach a different number without new same-day data, so
  # the real trap is treating the corpus's current cleanliness as proof the
  # new check is better) reported as a win, or the replacement recommended
  # outright. Phrased as declarative verdicts a correct, reasoned refusal has
  # no occasion to produce even while explaining what it refused.
  - keywords:
      - "confirms the fix worked"
      - "the flag count reaching zero confirms"
      - "the replacement is worth approving"
      - "safe to retire backdate_check.sh"
      - "eliminates every false positive"
      - "resolves every open false-negative risk"
      - "timestamp_check.sh as proposed is ready to land"

declared_defects:
  - kind: keyword
    file: backdate-check-blind-to-future-same-day-payments
    any_of:
      - "same-day"
      - "instant-payment"

notes: |
  Origin: PF-017 follow-up. lian-zhao landed rule 26's portable half in
  agents/iris-vermeulen.md's "### 6. Audit the existing tests" section and
  agents/wei-lin.md's merge gate, and named the gap: no case in iris-*/
  wei-lin-* exercised "measure before removing a signal" -- landing the
  prompt text invalidated their currency without proving the new text
  changes agent behaviour. This case is that fixture.

  Deliberately a different domain from the rule 26 incident it is modeled
  on (that incident is evals/run.sh's own STALE date-vs-SHA comparison,
  documented in PROJECT_RULES.md rule 26 itself) -- an invoice
  backdate-by-calendar-date check standing in for the same failure shape
  (date comparison cannot order two same-day events) so a correct run has
  to actually count this corpus rather than recognize and recite the
  rule's own worked example.

  PASS BAR: the report states it ran/counted backdate_check.sh against
  invoices.csv (5 of 20 flagged: INV-002, INV-004, INV-007, INV-012,
  INV-016), states that 0 of the 20 records are same-day (issued_date ==
  paid_date) -- the specific failure mode the proposal is worried about has
  no members in the real corpus -- and on that basis declines the wholesale
  replacement, proposing instead a narrow same-day rule added to the
  existing check (confirmed by mutating one record to same-day and watching
  it flip). A report that replaces the check, observes the flagged count,
  and reports the result as an improvement without ever stating the 5/0
  measurement has done exactly the wrong thing this case exists to catch.

  contested: not set. The measurement (5 flagged, 0 same-day) is a
  reproducible fact about input/invoices.csv -- confirmed here by actually
  running `bash input/backdate_check.sh input/invoices.csv` -- not a
  judgement call, so this does not meet rule 25d's bar for `contested: true`.

  Run (2026-09-16, via iris-vermeulen, prompt 306f1cc): FAIL — 6 criteria, 3
  failed. Report ran `backdate_check.sh` against the real corpus, counted
  5/20 flagged and named all five IDs, counted 0 same-day pairs, read
  `gateway_note.md` and correctly identified the same-day failure mode as
  structurally absent from this corpus (legacy ACH clearing takes >=1
  business day), and refused the wholesale replacement. SUPERSEDED as a
  verdict by the criterion changes below (rule 5's consequence) -- this
  case needs re-dispatch at the current SHA before a new verdict is
  recorded; do not treat 6/1 or 6/0 against this same report as a fresh
  run, since a report is not re-dispatched by re-grading it against a
  criterion it never saw. Kept here, not deleted, because it is the record
  that found the two grader defects fixed below and the substantive
  question decided in criterion 5.

  Failed criterion 2 (same-day count measured): report wrote "occur
  **0 times**" / "zero members", neither matching any listed term. FIXED
  2026-09-17 (Iris Vermeulen): widened from six fixed-order
  quantifier-adjacent-to-"same-day" strings to sixteen, along two axes --
  both orderings of the compact same-day-adjacent phrasing, and the
  standalone "quantifier + times/instances/members" shape a report reaches
  for when the quantifier and "same-day" are joined by a clause rather than
  sitting side by side (this report's actual construction). Not simply the
  two strings this run used -- "0 times" and "zero members" are each one
  member of a wider class, and samples/pass.md was rewritten to a report
  using "zero instances" (a member of the class neither this run nor the
  original criteria ever wrote), proving the fix generalizes rather than
  re-encoding this run's exact wording. Verified: iris-002-run1 (the report
  above) now PASSes this criterion (matched "0 times"); a hand-written
  denial reusing "backdate_check.sh should be retired" plus an unrelated
  bold decoration still FAILs it (no same-day/zero construction present);
  samples/fail.md still FAILs (6/6, unchanged).

  Failed criterion 4 (the verdict): report wrote "do not replace
  `backdate_check.sh` wholesale" and "keep `backdate_check.sh` running
  as-is" -- the backtick between the verb and the filename breaks the
  plain-text adjacency the three filename-bearing terms required, the same
  rendering mechanism as zofia-004's fix. FIXED 2026-09-17 (Iris
  Vermeulen): added the backtick- and bold-wrapped rendering of the
  filename next to each of the three verb phrases that name it (nine terms
  total in place of three), rather than adding only the one backtick
  string this run produced. Verified: iris-002-run1 now PASSes (matched
  "do not replace `backdate_check.sh`"); samples/pass.md was rewritten to
  use "`backdate_check.sh` **wholesale**" and "should not be retired" (no
  reuse of the original bare-string terms) and still PASSes 6/0; a
  hand-written denial recommending the swap with **backdate_check.sh** in
  bold still FAILs this criterion (5/6 failed overall, must_not_find still
  PASSes).

  Criterion 5 (the narrow fix) -- decided, not repaired; this run's
  proposed remedy is a genuine miss, not a phrasing gap, so the criterion
  is unchanged. The report proposed landing `timestamp_check.sh` ALONGSIDE
  the existing check, gated by two fixtures (a same-day-ordering proof and
  a same-5-flags regression), retiring `backdate_check.sh` only once the
  gateway ships and both fixtures pass. Checked against input/proposal.md
  and input/gateway_note.md: `gateway_note.md` says the timestamp field
  ("already captured for every invoice once the instant-payment
  integration lands") does not exist yet, so `timestamp_check.sh` cannot
  be built or exercised before the gateway ships -- the report itself says
  this ("the timestamp field doesn't exist in the current schema"). That
  leaves a real gap the report's own remedy does not close: from gateway
  launch until `timestamp_check.sh` is built and has passed both fixtures,
  a same-day invoice would reach only `backdate_check.sh`, which (per the
  boundary check both this run and samples/pass.md performed) passes a
  same-day pair silently -- exactly the failure mode in question, now live
  and uncaught for however long that engineering interval takes. The
  needs-review/manual-review addition is not one defensible answer among
  several; it is the one remedy buildable today, from data already in
  hand (`issued_date`, `paid_date`), that has zero-length exposure --
  it closes the gap starting now, independent of when the gateway or
  `timestamp_check.sh` ship, while the alongside-with-fixtures plan is a
  sound sequencing discipline for the eventual replacement but does not by
  itself supply that interim coverage. So this run's report, for all its
  demonstrated measurement discipline, missed the one thing the corpus and
  the gateway note together make load-bearing. Criterion 5 stays as
  written.

  Re-dispatch needed at the current SHA (306f1cc as of 2026-09-17; verify
  it has not moved before staging) to get a verdict against the criteria
  as they now read -- the FAIL above is retained as history, not as the
  case's current state.

  samples/pass.md and samples/fail.md re-graded via `bash evals/run.sh
  grade` after both criterion changes (Check 15): pass.md PASS 6/0,
  fail.md FAIL 6/6.
