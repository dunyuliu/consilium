id: priya-001
agent: priya-nair
prompt: |
  Verify the headline figures in input/PERFORMANCE_SUMMARY.md by
  re-deriving them independently from input/account_values.csv. Report
  which claims hold and which do not, with the corrected values.
input_dir: input
expected:
  # NOT kind: location. priya-nair's output schema (agents/priya-nair.md:108)
  # is a per-claim table with an Anchor column — she cites the data file and
  # the re-derivation, never doc:line. Demanding a line citation would fail a
  # correct audit for using its own documented format. The anchor is retained
  # as a comment so the planted defect stays locatable by a human:
  #   PERFORMANCE_SUMMARY.md:24 — "(1 + mean(monthly returns)) ** 12 - 1"
  - kind: keyword
    any_of:
      - "geometric"
      - "arithmetic"
      - "mean of"
      - "compounding the average"
      - "9.59"
      - "9.6"
    severity: critical
  - kind: keyword
    any_of:
      - "9.59"
      - "9.5937"
      - "4.92"
      - "59"
      - "period"
    severity: major
  - kind: keyword
    any_of:
      - "-1.9"
      - "−1.9"
      - "1.90"
      - "worst month"
must_not_find:
  - keywords:
      - "all figures are correct"
      - "the summary is accurate"
      - "total return is wrong"
      - "total return does not reconcile"
      - "56.9% is incorrect"
notes: |
  Three planted defects and one deliberate control. All values below were
  computed from the committed CSV, not estimated.

  The CSV holds 60 month-end marks (2019-01 .. 2023-12), first 100000.00,
  last 156895.91. Sixty observations bound FIFTY-NINE monthly intervals,
  i.e. 4.9167 years — not 5.

  Defect 1 (critical, PERFORMANCE_SUMMARY.md:20). The stated method
  compounds the ARITHMETIC mean monthly return: (1 + mean(r))**12 - 1 =
  9.6792%, reported as "9.7%". The correct geometric figure is
  (last/first)**(12/59) - 1 = 9.5937%. Averaging returns before compounding
  is the classic overstatement — Jensen's inequality guarantees the
  arithmetic route is >= the true compounded rate, so the error always
  flatters the manager. This is the primary defect and the one the fee
  calculation depends on.

  Defect 2 (major, the "5 years" period claim). Treating 60 marks as 5.0
  years instead of 59 intervals / 4.9167 years. Note the direction: on its
  own, this defect would UNDERSTATE the rate (9.4265% if you compound
  geometrically over 5.0 years), so the two errors partly offset. A verifier
  who finds only one may conclude the headline is "about right"; both must
  be unpicked to land on 9.5937%.

  Defect 3 (minor, "Worst month -1.5%"). The actual minimum monthly return
  is -1.90%. Best month +2.60% is stated correctly.

  CONTROL (must not be flagged): total return 56.9% is CORRECT —
  156895.91/100000 - 1 = 56.8959%. An auditor who reports it as wrong is
  manufacturing findings, which the must_not_find entries guard against.

  Pass condition: identify the arithmetic-vs-geometric error at the method
  line AND land on ~9.59% as the corrected CAGR. Catching the period-length
  and worst-month errors is the strong pass. Falsely flagging total return
  fails the case.

  must_not_find is phrased as verdict assertions only, so a correct report
  saying "total return reconciles" cannot trip it.

  First run (2026-07-31, manual, scoped to input/): PASS on substance. Found
  all three planted defects — the arithmetic-vs-geometric formula (9.68% vs
  9.5937%), the 59-vs-60 interval error, and the worst month (-1.90%, not
  -1.5%) — and correctly PASSED the total-return control. It also identified
  the exact wrong month the -1.5% came from (2020-11, the 3rd worst), and ran
  an internal-consistency check that was not planted: (1.097)^5 - 1 = 58.9%
  contradicts the document's own 56.9% total return, a 2.0 pp self-inconsistency
  visible without any external data.

  The run exposed a fixture defect, since fixed: expected[0] was kind: location,
  demanding a doc:line citation. priya-nair's documented output schema is a
  per-claim table with an Anchor column and she never cites doc:line — the
  criterion would have failed a correct audit for using its own format. A
  fixture must assert what the agent's contract says it produces.
