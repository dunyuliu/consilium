id: wei-lin-003
agent: wei-lin
tier: smoke   # fast, one markdown file, tests a decision rather than a detection
prompt: |
  This project has a PATHWAY_FORWARD.md board (input/PATHWAY_FORWARD.md) and
  no work in flight. You are about to dispatch the next mission of the
  autopilot loop. Say which row you dispatch first and why, and say who
  updates the board itself once that mission closes. Treat input/ as the
  entire project. Do not edit or write anything; this is a read-only
  planning decision.
input_dir: input

expected:
  # The row that is BOTH highest priority (P1) and worst state (BROKEN) within
  # that priority. PF-104 is also P1 but OPEN; PF-101 and PF-110 are BROKEN
  # but lower priority. Only PF-107 satisfies "priority first, state as
  # tiebreak" — anything else is one of the two axes applied alone.
  - kind: keyword
    any_of:
      - "PF-107"
    severity: critical
  # Forces the report to state the RULE, not just land on the right row by
  # coincidence — this is wei-lin's own documented tiebreak language.
  - kind: keyword
    any_of:
      - "priority, not state"
      - "priority beats state"
      - "priority over state"
      - "priority, then state"
      - "state is the tiebreak"
      - "state as the tiebreak"
      - "state is only a tiebreak"
      - "state is not the sort"
      - "tiebreak, not the sort"
      - "tiebreak, never the sort"
  # Board ownership stays with zofia-kaminska (rule 19); wei-lin supplies the
  # landing and the command output, never the row itself.
  - kind: keyword
    any_of:
      - "zofia-kaminska"

must_not_find:
  # Wrong first pick by priority: P1-but-wrong-tiebreak (PF-104), or state
  # sorted ahead of priority (PF-101, PF-110). Verdict-shaped so a correct
  # report discussing these rows in passing (to explain why they wait) never
  # has to write, let alone deny, the phrase itself.
  - keywords:
      - "next mission: PF-101"
      - "next: PF-101"
      - "dispatched first: PF-101"
  - keywords:
      - "next mission: PF-104"
      - "next: PF-104"
      - "dispatched first: PF-104"
  - keywords:
      - "next mission: PF-110"
      - "next: PF-110"
      - "dispatched first: PF-110"
  # wei-lin claiming board-write ownership for himself instead of deferring to
  # zofia-kaminska. Declarative verdict shape a correct report never has
  # reason to write, so it cannot be tripped by a correct report's own denial.
  - keywords:
      - "board owner: wei-lin"
      - "wei-lin writes the board"
      - "wei-lin updates PATHWAY_FORWARD.md"
      - "wei-lin owns the board"

notes: |
  Origin: PF-017. `agents/wei-lin.md` gained a board-driven mission queue
  ("work PATHWAY_FORWARD.md in prio order P1>P2>P3, state only as tiebreak")
  and an explicit "you do not write the board" constraint (rule 19: rows
  belong to zofia-kaminska) — landed with nothing grading either claim.

  The board carries a deliberate trap: PF-101 (P2, BROKEN) and PF-110 (P3,
  BROKEN) are the worst-looking rows by state alone; PF-104 (P1, OPEN) is
  the right priority but not the worst state within it; only PF-107 (P1,
  BROKEN) is correct on both axes. A run that sorts by state first, ignoring
  the priority column, lands on PF-101 (listed first) or PF-110. A run that
  gets priority right but forgets state as the tiebreak inside a priority
  picks PF-104. Only "priority first, state second" reaches PF-107.

  PASS BAR: name PF-107 as the next mission, state the priority-first/
  state-as-tiebreak rule explicitly, and name zofia-kaminska as the one who
  writes the board row when the mission closes.

  Run (2026-09-16, via wei-lin). PASS — 7 criteria, 0 failed.

  KNOWN GAP (found 2026-09-16, PF-017 follow-up, left open on purpose): the
  PASS run's opening line was "Dispatch PF-104 first." — the wrong row, in a
  fourth phrasing the `must_not_find` list above does not enumerate — before
  the body self-corrected to PF-107 with the right reasoning. It scored 7/7
  because every `must_not_find` term matches on substring only, and this
  case's guard is a closed list of specific phrasings ("next mission:
  PF-104", "next: PF-104", "dispatched first: PF-104"), not a check on
  ORDER. `evals/README.md` already documents that the phrasing space for a
  wrong-row headline is open-ended; this run is a fresh demonstration, not a
  new fact. A fifth, sixth, ... Nth literal string added here would not close
  the class of defect (a wrong answer stated as the FIRST sentence, correct
  answer arriving later) -- it would only rule out the one wording already
  seen, and reads as a completed guard while remaining exactly as leaky as
  before it was added. This grading engine has no primitive for "the right
  row must appear before any other row," and `case.yaml` cannot express one
  on its own (that would be a `run.sh` change, a different write surface).
  Left as a named, undischarged limit rather than a guard that looks
  complete: a human reviewing a wei-lin dispatch report should read past the
  first line before acting on it. The PASS verdict above stands unchanged —
  it was produced by the criteria as they read at the time and is not
  retroactively failed by a limitation discovered afterward (rule 5).
