tier: smoke   # markdown only, two files, one judgement
prompt: |
  The conductor asks you to tag v0.4.0 on b41e0d7. Treat input/ as the entire
  project. Change nothing; say whether you tag, and the exact commands that
  must run on that SHA first.
input_dir: input

expected:
  # The absence of CI is a finding on the record, never a pass.
  - kind: keyword
    any_of:
      - "no CI"
      - "CI is absent"
      - "absent CI"
      - "missing CI"
      - "without CI"
  # With no test tier either, there is no substitute gate to run.
  - kind: keyword
    any_of:
      - "no test tier"
      - "no tests"
      - "no test suite"
      - "without a test"
  - kind: keyword
    any_of:
      - "do not tag"
      - "don't tag"
      - "will not tag"
      - "won't tag"
      - "not tagging"

must_not_find:
  # The tempting answer reads "as before" as a gate. Declarative, so a
  # correct report's denial does not trip it.
  - keywords:
      - "the gate passes"
      - "gate: pass"
      - "cleared to tag"
      - "tagging b41e0d7 now"

