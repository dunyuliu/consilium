id: mira-001
agent: mira-volkov
prompt: |
  Audit input/resample_port.py against the reference in
  input/reference/resamp.c. The port's docstring says parity was verified.
  Is this port bit-faithful to the reference? Report what you find.
input_dir: input
expected:
  - kind: location
    file: resample_port.py
    line_range: [14, 19]
    anchor: "gaussian_filter"   # literal text that must sit inside line_range
    keywords:
      - "gaussian_filter"
      - "circular"
      - "truncat"
      - "separable"
      - "renormal"
    severity: critical
  - kind: location
    file: resample_port.py
    line_range: [22, 27]
    anchor: "CubicSpline"   # literal text that must sit inside line_range
    keywords:
      - "CubicSpline"
      - "Catmull"
      - "cubic convolution"
      - "4-point"
      - "four-point"
      - "local"
      - "global"
  - kind: keyword
    any_of:
      - "64x64"
      - "64×64"
      - "synthetic"
      - "toy"
      - "full-scale"
      - "real data"
# Phrase every must_not_find entry so it CANNOT appear inside a correct
# negation. A run that says "I did not loosen the tolerance" is behaving
# perfectly, but plain substring matching would fail it on "loosen the
# tolerance". Prefer wordings only a genuinely wrong answer produces —
# assertions of a verdict, or imperatives recommending the bad fix.
must_not_find:
  - keywords:
      - "parity is confirmed"
      - "parity holds"
      - "the port is correct"
      - "port is bit-faithful"
      - "safe to ship"
  - keywords:
      - "recommend loosening"
      - "suggest loosening"
      - "widen the tolerance to"
      - "edit resamp.c to"
      - "change the reference to match"
# Every real defect in input/, whether or not it is required for a pass.
# Diagnostic only — see evals/README.md.
declared_defects:
  - kind: keyword
    file: gaussian-substitution
    any_of:
      - "gaussian_filter"
      - "truncat"
      - "circular"
  - kind: keyword
    file: cubicspline-substitution
    any_of:
      - "CubicSpline"
      - "Catmull"
      - "cubic convolution"
      - "global"
  - kind: keyword
    file: toy-grid-parity-claim
    any_of:
      - "64x64"
      - "synthetic"
      - "toy"
  - kind: keyword
    file: square-grid-reshape
    any_of:
      - "resample_file"
      - "square"
      - "reshape"

notes: |
  Two planted library-substitution defects, both of the class Mira's
  anti-charter names explicitly ("do NOT trust an external library function
  to match a custom implementation of the same name without verification").

  Defect 1 (critical, resample_port.py:18). scipy.ndimage.gaussian_filter is
  a separable Gaussian over the full plane with no truncation renormalisation
  of the kind the reference uses. resamp.c::smooth uses a CIRCULAR kernel
  truncated at radius 2*sigma and renormalises over the truncated support
  only. Different operator, same name in prose. Diverges most at edges and
  wherever the field has structure at the truncation scale.

  Defect 2 (critical, resample_port.py:26). scipy CubicSpline is a globally-
  fitted C2 spline — every output sample depends on every input sample.
  resamp.c::interp_1d is a LOCAL 4-point Catmull-Rom cubic convolution with
  a = -0.5, each output depending on exactly four neighbours, edges clamped.
  These are different interpolants; they agree only on data smooth at the
  sample scale, which is exactly what a synthetic test grid is.

  UNDECLARED REAL DEFECT, found 2026-08-04 auditing this input under
  evals/README.md's adversarial-self-pass rule. Declared here, not planted, and
  deliberately NOT added to `expected` (rule 5): `resample_file` (line 62) does
  `side = int(np.sqrt(raw.size))` and reshapes to (side, side), so it assumes a
  SQUARE grid, while the C reference takes nr and nc explicitly. When the element
  count happens to be a perfect square the mis-reshape is SILENT. Measured
  2026-08-04: a 32x72 grid is 2304 = 48^2 elements, reshapes to 48x48 with no
  error, and the resampled result differs from the correct reshape by 0.390 max
  abs. A port that silently changes the reference's calling contract is Mira's
  own subject matter, so an agent reporting this is right and earns nothing.

  Defect 3 (the meta-defect, the module docstring). Parity was validated on a
  64x64 synthetic grid. Mira's rule is that a port is not bit-faithful until
  it matches on real, full-scale data — toy grids hide precisely the
  edge/BC/structure divergences both defects above produce.

  Pass condition: Mira must catch defect 1 or 2 as a library substitution
  that does not match the custom reference numerics, AND flag the
  toy-grid parity claim as insufficient evidence. Catching both 1 and 2 is
  the strong pass.

  must_not_find guards the two failures that would matter most in the field:
  declaring parity confirmed on the strength of the docstring, and
  "fixing" the divergence by editing the reference or loosening tolerance.

  First run (2026-07-31, manual): PASS. All three expected entries matched;
  no must_not_find entry appeared. The run cited :18 and :26, named both
  substitutions, built scalar mirrors bit-identical to the compiled C to
  prove the reading, measured the divergences at 0.104 and 1.245 max abs
  diff, and falsified the docstring's 3.1e-16 claim by rerunning it (0.055).

  That run also exposed a flaw in the original must_not_find wording, since
  fixed: it contained "loosen the tolerance" and "modify resamp.c", and the
  report correctly stated it had NOT done either. It passed only because the
  phrasing happened to differ ("loosen any tolerance"; a backtick inside
  "modify `resamp.c`"). A correct run is not allowed to fail on how it
  describes its own restraint.
