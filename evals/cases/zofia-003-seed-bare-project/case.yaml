id: zofia-003
agent: zofia-kaminska
tier: smoke   # fast, markdown only, and the only test of Mode A — seeding
prompt: |
  This project has no rules yet. Seed a rule book for it. Report the seed you
  would write: name every file you would create, every rule you would adapt to
  this project, and every starter rule you would drop. Treat input/ as the
  entire project; the paths you have are the paths there are.
input_dir: input

expected:
  # THE PRIMARY CRITERION. Her invariant 1 whitelists four root documents and
  # says "day one owes README.md, CLAUDE.md, PATHWAY_FORWARD.md and this rule
  # book", and her Isolation section carves out Mode A permission to create the
  # two that do not exist. Observed failure 2026-09-16: a real Mode A run
  # produced neither. Nothing in the suite reached Mode A at all, so nothing
  # could see it. The word appears nowhere in input/ — it can only come from
  # her own invariant.
  - kind: keyword
    any_of:
      - "CLAUDE.md"
  # The rule book itself, by the canonical name her Step 0 insists on.
  - kind: keyword
    any_of:
      - "PROJECT_RULES.md"
  # TODO.md is a status board under another name, and Mode A names that exact
  # case: do not seed a second one beside it, propose the rename as a single
  # move, let the user decide. Two boards is the failure; a misnamed one is not.
  - kind: keyword
    any_of:
      - "rename"
      - "renaming"
      - "one move"
  # "Adapt, don't paste": a rule that says "run the test suite" without naming
  # the command is unenforceable by her own standard. The command exists in the
  # Makefile and in CONTRIBUTING.md, so naming it requires reading, not
  # invention — this criterion tests adaptation, not discovery.
  - kind: keyword
    any_of:
      - "make test"
  # Step 0 makes CONTRIBUTING.md the deliberate near-miss: a file of recipes is
  # documentation, not binding constraints. Her own words: "say so and keep
  # looking." A run that promotes it to rule book has skipped the judgement the
  # whole step exists for.
  - kind: keyword
    any_of:
      - "not a rule book"
      - "not rules"
      - "recipes"
      - "how-to"

must_not_find:
  # NOTE, 2026-09-16: "no files were created" and "I created nothing" were
  # guards here and were REMOVED before the first run, because they punished
  # the correct answer. `evals/run.sh stage` appends "STRICT: read-only — do
  # not create, edit, or delete anything there" to every staged brief,
  # unconditionally (run.sh:96). Under that clause a correct run cannot create
  # anything and may well say so, so the guard fired on exactly the behaviour
  # the harness demands. The case prompt now asks for the seed as a report.
  #
  # This is the class of defect PF-003 exists to find: the fixture was wrong
  # and only attempting to run it showed that. Restore those guards only
  # alongside a writable staging mode, which is not built.
  # Wrong classification at Step 0. Declarative, and subject-first so a denial
  # ("CONTRIBUTING.md is not the rule book") does not contain it.
  - keywords:
      - "CONTRIBUTING.md is the rule book"
      - "CONTRIBUTING.md is the authoritative"
  # The second board. Phrased as the completed act: a correct report saying it
  # did NOT create the file produces "PATHWAY_FORWARD.md has not been created",
  # which does not contain this guard. "created PATHWAY_FORWARD.md" was tried
  # and removed — "I have not created PATHWAY_FORWARD.md" contains it, and that
  # is a sentence only a correct run writes.
  - keywords:
      - "PATHWAY_FORWARD.md has been created"

# Every real thing in input/ a thorough seed would react to, whether or not it
# is required for a pass. Diagnostic only — see evals/README.md.
declared_defects:
  - kind: keyword
    file: readme-is-a-design-doc
    any_of:
      - "design doc"
      - "governing equations"
      - "where this is going"
  - kind: keyword
    file: board-claims-carry-no-command
    any_of:
      - "TODO.md"
      - "no command"
      - "never re-derived"
  - kind: keyword
    file: baseline-regenerated-by-hand
    any_of:
      - "baseline"
      - "spring_neap_2019"
      - "read-only"
  - kind: keyword
    file: evidence-and-scratch-indistinguishable
    any_of:
      - "runs/"
      - "41 GB"
      - "evidence"

notes: |
  MODE A CONTROL for zofia-kaminska - the first fixture in the suite that
  reaches her seeding mode at all. Why it exists, the two traps in the input,
  the pass bar and what the harness cannot see are in this case's README.md,
  not duplicated here. Two must_not_find guards were removed for colliding with
  the read-only limit, and the collision is recorded above them.

  Verified by the author before shipping, per evals/README.md: "CLAUDE.md",
  "PROJECT_RULES.md" and "PATHWAY_FORWARD.md" appear nowhere in input/, so no
  criterion is satisfiable by echo; `make test` appears in the Makefile and in
  CONTRIBUTING.md, deliberately, because that criterion tests adaptation rather
  than discovery; every guard was graded against the correct report's negation
  before shipping (rule 25), and one was removed for failing that test - the
  removal is recorded above the guard it replaced.

  Run (2026-09-16, via a fresh zofia-kaminska dispatch): FAIL - 6 of 7. Named
  CLAUDE.md and PROJECT_RULES.md as files to create, adapted rule 5's calibrated
  metric, correctly proposed folding TODO.md into PATHWAY_FORWARD.md as one move
  rather than seeding a second board, independently found all four declared
  defects (readme design-doc framing, TODO.md's uncommanded claims, the
  hand-regenerated baseline, the evidence/scratch mixing in runs/), and tripped
  no must_not_find guard. The one failure is wording, not substance: the fold is
  described ("TODO.md itself would be moved/retired, not left beside it") but
  never as a rename, which is the term that criterion anchors on.
