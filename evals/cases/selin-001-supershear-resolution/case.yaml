id: selin-001
agent: selin-aydin
prompt: |
  Reviewer-2 this manuscript. It is under review at GJI and I am the handling
  editor; I want the adversarial read before I write the decision letter.
  Treat input/ as the entire submission: do not read, list, or grep anything
  above it — specifically not case.yaml or the parent README.md.
expected:
  # --- the primary defect: the grid spacing, justified by the wrong criterion
  - kind: location
    file: manuscript.md
    line_range: [94, 101]
    anchor: "uniform on-fault node spacing of 250 m"
    keywords:
      - "cohesive zone"
      - "process zone"
      - "breakdown zone"
      - "under-resolved"
      - "underresolved"
      - "cells across"
      - "nodes across"
      - "elements across"
    severity: critical
  # --- the second limb of the same defect: refinement run in the wrong
  #     direction, scored on an observable that cannot see the defect
  - kind: location
    file: manuscript.md
    line_range: [103, 107]
    anchor: "uniform on-fault spacing of 500 m"
    keywords:
      - "coarser"
      - "500 m"
      - "125 m"
      - "refine"
      - "refinement"
      - "convergence"
      - "insensitive"
    severity: critical
  # --- the arithmetic must actually be run, not asserted
  - kind: keyword
    any_of:
      - "423"
      - "420"
      - "425"
      - "430"
      - "317"
      - "320"
      - "1.69"
      - "1.27"
      - "1.7 cells"
      - "1.3 cells"
      - "2 cells"
      - "two cells"
      - "fewer than two"
      - "fewer than 2"
  # --- the verdict the arithmetic forces
  - kind: keyword
    any_of:
      - "grid-dependent"
      - "grid dependent"
      - "mesh-dependent"
      - "mesh dependent"
      - "numerical artifact"
      - "numerical artefact"
      - "resolution artifact"
      - "resolution artefact"
      - "not converged"
  # --- the claim that dies with it
  - kind: keyword
    any_of:
      - "transition distance"
      - "44 km"
      - "supershear transition"
must_not_find:
  # (a) attacking the station-exclusion CONTROL. The exclusion has a stated
  #     physical cause (no basin in the velocity model), was declared before
  #     the fits were computed, the excluded residuals are printed in Table 2
  #     with their sign and size, both the 12-station and 14-station means are
  #     given, and the retained set keeps the four worst non-basin fits.
  #     Phrased as assertions a correct run cannot produce: a run that finds
  #     the exclusion defensible writes "is justified", not "is not
  #     unjustified".
  - keywords:
      - "the station exclusion is unjustified"
      - "no physical reason is given for excluding"
      - "no physical reason is given for the exclusion"
      - "the exclusion of KVK and DRB is post hoc"
      - "the excluded stations are not reported"
      - "including KVK and DRB is recommended"
      - "the two basin stations must be included in the"
  # (b) attacking the frequency-band CONTROL. 2600 m/s / (1 Hz x 250 m) =
  #     10.4 nodes per wavelength, twice the stated criterion, and the paper
  #     explicitly declines to claim PGA. The band claim is conservative.
  - keywords:
      - "the reported frequency band exceeds what the grid resolves"
      - "the 1 Hz band is overstated"
      - "the PGA comparison is unsupported"
  # (c) attacking the nucleation CONTROL or the stress budget, both of which
  #     are internally consistent (see notes for the arithmetic).
  - keywords:
      - "the nucleation patch is too large"
      - "the nucleation is oversized"
      - "the nucleation procedure contaminates the reported"
      - "the static stress drop is inconsistent with the mean slip"
      - "the supershear speed is unphysical"
  # (d) scope creep: selin-aydin is read-only and does not rewrite manuscripts.
  - keywords:
      - "I have revised Section"
      - "I edited the manuscript"
      - "I rewrote the resolution section"
notes: |
  DETECTION fixture. Full derivation, the four controls (C1-C4, first three
  guarded by must_not_find), and the adversarial-pass writeup live in this
  case's README.md - not duplicated here. Summary: manuscript.md Section 2.5
  (lines 94-107) justifies a 250 m on-fault grid via nodes-per-shear-
  wavelength (arithmetically correct, wrong physics) instead of the
  breakdown-zone width Lambda_0 = (9 pi/32) mu* Dc/(tau_p-tau_r), which
  computes to 317-423 m = 1.27-1.69 cells at dx=250m, below the 3-5 cell
  working threshold. The paragraph's own "convergence" check refines coarser
  (250->500m, never finer) and scores Mw/mean slip, both insensitive to the
  defect. Consequence: the 44 km transition distance and the 31.0+/-2.0 MPa
  asperity-prestress constraint are not shown independent of dx.

  Deliberately absent from the input, so the reviewer must supply them: the
  words "cohesive zone", "process zone", "breakdown zone", "S-ratio",
  "resolution test", "grid-dependent". Detection here cannot be string matching.

  Note for the record: the fixture's 423 and 317 are mode II and mode III of one
  estimate (423.5/317.6 = 1.3333 = 1/(1-nu) at nu=0.25) - two conventions, not
  three.

  Run (2026-09-16, via selin-aydin): FAIL - 6 of 9. Substance was largely right
  - the ~1.3-cell cohesive-zone under-resolution, the wave-vs-rupture criterion
  conflation, the convergence test scored on an insensitive observable - but it
  cited no manuscript.md line inside either planted range (94-101, 103-107), so
  both `location` criteria failed on `line-in-range=0`. All four must_not_find
  guards passed.

  Later run (2026-09-16, via selin-aydin): FAIL - 9 criteria, 1 failed. The
  `any_of` arithmetic block (case.yaml lines 39-49, accepting
  423/420/425/430/317/320/1.69/1.27) failed: the agent computed 739 m / ~3.0
  nodes from `L0 = (9*pi/32)*mu*Dc*(tau_p - tau_r)/(tau_p - tau_0)^2` rather
  than the Palmer-Rice/Andrews `L0 = (9*pi/32)*mu*Dc/(tau_p - tau_r)` = 317.6 m
  = 1.27 cells at dx=250 m. Adjudicated AGENT defect, criterion stands, on an
  invariant the manuscript itself fixes: Table 1 gives ONE global sigma_n, mu_s,
  mu_d, Dc, so the breakdown-zone width is the same everywhere on the fault and
  cannot be a function of prestress - the agent's form makes it one, then called
  the asperity "adequately resolved" at a claimed 16 nodes, understating 1.27
  cells as 3.0.

  Diagnostic only: the agent led with the tau_0a circularity, which this case's
  README records as scrubbed in the adversarial pass.
