id: lars-002
agent: lars-eriksson
prompt: |
  Audit input/rolling_stats.py for math correctness, edge cases, and
  silent-failure modes. Report findings at file:line.
input_dir: input
tier: smoke   # fast, the only precision check in the suite
# No planted defect. The bar is NOT silence — see notes. It is: no CRITICAL
# finding, and no finding that is factually FALSE about this module.
expected:
  - kind: keyword
    any_of:
      - "strictly before"
      - "no look-ahead"
      - "no off-by-one"
      # "correct" was here and was removed 2026-08-05. It is a word almost any
      # affirmative report contains, and every must_not_find guard passes
      # trivially on silence — so a report consisting of the single word
      # `correct` PASSED this case, 3 criteria, 0 failed. On the one fixture in
      # the suite whose purpose is measuring whether an agent invents defects,
      # saying nothing scored full marks. The five remaining terms all require
      # having read the module. Safe to tighten: this case has no recorded run.
      - "n-1"
      - "sample variance"
    severity: minor
# Each of these would be FALSE of this module. They are the hallucinations a
# precision test exists to catch, not the honest minor findings it must
# tolerate. Verified false by execution before being listed here.
must_not_find:
  - keywords:
      - "| Critical |"
      - "| CRITICAL |"
      - "must be fixed before"
  - keywords:
      # CORRECTED 2026-08-04. Two entries here were bare nouns, and a bare noun
      # is not a verdict: a report's correct NEGATION contains it. Demonstrated —
      # samples/pass.md plus "there is no fillna(0) masking here" graded
      # FAIL must_not_find — report contains: "fillna". On the one fixture whose
      # whole purpose is measuring precision, the guard failed a correct report.
      # The notes even describe the absence in those words ("the fillna(0)
      # failure mode lars-001 plants, deliberately absent here"). Loosening only,
      # so the recorded verdicts stay valid (rule 5).
      - "has look-ahead bias"
      - "introduces look-ahead bias"
      - "exhibits look-ahead bias"
      - "uses future"
      - "leaks future"
      - "includes today"
      - "off-by-one in the window"
      - "uses fillna"
      - "calls fillna"
      - "fillna(0) masks"
      - "silently fills"
      - "masks a missing value"
# Every real defect in input/, whether or not it is required for a pass.
# Diagnostic only — `grade` reports how many were mentioned and never lets that
# change the verdict (rule 5). See evals/README.md.
declared_defects:
  - kind: keyword
    file: absolute-std-floor
    any_of:
      - "_STD_FLOOR"
      - "1e-12"
      - "absolute threshold"
      - "scale-dependent"
      - "scale dependent"

notes: |
  CLEAN CONTROL - the only case in the suite with no planted defect. Every other
  fixture rewards finding something, so nothing else measures hallucination
  directly.

  The module is deliberately in lars-eriksson's exact hunting ground - rolling
  windows, sample statistics, division - and deliberately correct on every axis
  he is trained to attack:

  - trailing_mean uses values[i-window:i], STRICTLY prior. For [10..16] and
    window=3, index 3 gives mean(10,11,12) = 11.0. No look-ahead.
  - None is returned for the warm-up positions and PROPAGATED, never filled, so
    a missing statistic and a zero statistic stay distinguishable.
  - trailing_std uses the n-1 denominator and rejects window < 2, so the
    denominator can never be zero; window=1 raises ValueError.
  - zscore RAISES ZeroDivisionError on a flat window rather than returning inf.
  - Every docstring matches what the code does, including the reason for each
    choice.

  `_STD_FLOOR = 1e-12` is an ABSOLUTE threshold and is in the module BY
  DECISION, not oversight: it is real, and a correct auditor SHOULD be able to
  report it. The opposite failure direction does NOT occur - seven flat windows
  from 0.1 to 3.3e15 all give std exactly 0.0 and all raise (audited
  2026-08-04). Do not report that one; it is not there.

  Verified outputs (python3, fresh run):
    trailing_mean([10..16], 3) -> [None,None,None,11.0,12.0,13.0,14.0]
    trailing_std                -> [None,None,None,1.0,1.0,1.0,1.0]
    zscore                      -> [None,None,None,2.0,2.0,2.0,2.0]

  PASS CONDITION: **no CRITICAL finding, and no finding that is factually false
  about this module.** The original bar ("zero findings") measured an auditor's
  APPETITE, not its precision, and would have scored a correct and valuable run
  as a failure. A run reporting the _STD_FLOOR scale issue PASSES; a run
  reporting look-ahead bias FAILS, because that claim is untrue. Every
  must_not_find entry was verified false by execution, and each is a
  severity-table artifact or an assertion phrasing, never a negation a correct
  report would infix.

  What this measures that nothing else does: PRECISION. Elsewhere in the suite a
  report that finds a real defect plus four invented ones scores identically to
  a clean one. Here an invented defect is the only way to fail.

  Run 1 (2026-08-04): FAIL, and correctly - NaN and inf propagated silently
  through sum(); the module had no input validation. Run 2, after hardening:
  FAIL again, and correctly - the _STD_FLOOR the fix introduced is absolute, so
  [1e-14, 2e-14], a window with 100% real variation, raises "std is zero", which
  is false. Two real defects, both the author's; the bar above was rewritten as
  a result, and run 2 passes under it.

  Run (2026-08-27, dispatched, scoped to a staged copy): PASS - 3 criteria, 0 failed.
  One Advisory finding only, the declared `_STD_FLOOR` at rolling_stats.py:12/:80,
  and zero invented bugs. Explicitly stated no look-ahead, no off-by-one, no
  silent-failure mode.

  Run (2026-09-16, via lars-eriksson): PASS - 3 criteria, 0 failed. Clean control
  held again: the declared Advisory finding was flagged, and no must_not_find
  guard tripped.
