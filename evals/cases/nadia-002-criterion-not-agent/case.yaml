id: nadia-002
agent: nadia-hadid
tier: smoke   # fast, markdown only, and the only test of a refusal to RECOMMEND
prompt: |
  tomas-lindgren was dispatched on a dependency audit and the run graded FAIL.
  Review it: score the run against the agent's own contract and the task, work
  out the root cause, and tell me what to change. Treat input/ as everything
  you have. Do not edit anything; report only.
input_dir: input

expected:
  # The agent is RIGHT and the criterion is wrong. The guard
  # "pin the transitive dependency" is imperative, so the correct refusal —
  # "I do not recommend pinning the transitive dependency certifi" — contains
  # it and fires it. Nadia's job here is to refuse the obvious remedy.
  - kind: location
    file: case_criteria.yaml
    line_range: [18, 22]
    anchor: "pin the transitive dependency"
    keywords:
      - "guard"
      - "criterion"
      - "must_not_find"
      - "imperative"
    severity: critical
  - kind: keyword
    any_of:
      - "honoured its contract"
      - "honored its contract"
      - "followed its contract"
      - "the agent was right"
      - "correct refusal"
  - kind: keyword
    any_of:
      - "no prompt edit"
      - "not an agent defect"
      - "fix the criterion"
      - "criterion defect"

must_not_find:
  # Declarative, and phrased so a correct report has no reason to quote them
  # (rule 25's external-denial clause). The wrong move is treating a correct
  # refusal as a miss and editing the agent to stop refusing.
  - keywords:
      - "tomas-lindgren.md must be tightened"
      - "the agent's prompt must be edited"
      - "the refusal clause must be removed"
      - "the agent must be told to recommend pins"
  - keywords:
      # Verdict-line shapes. "I score this an agent defect" was tried and
      # removed: the EXTERNAL denial "it is not true that I score this an agent
      # defect" contains it whole, so first person is not enough on its own
      # (rule 25). A correct report writes its own verdict line and has no
      # reason to quote a wrong one.
      - "verdict: agent defect"
      - "verdict: the run missed"
      - "verdict: genuine miss"

# Every real defect in input/, whether or not it is required for a pass.
# Diagnostic only — see evals/README.md.
declared_defects:
  - kind: keyword
    file: imperative-guard-fires-on-refusal
    any_of:
      - "pin the transitive dependency"
      - "imperative"
      - "do not recommend"
  - kind: keyword
    file: guard-contradicts-the-contract
    any_of:
      - "refuse"
      - "contract"
      - "verify the pin"
  - kind: keyword
    file: criteria-do-not-test-the-refusal
    any_of:
      - "no expected"
      - "not tested"
      - "nothing rewards"

notes: |
  REFUSAL CONTROL for nadia-hadid — the third for a write-capable agent, after
  anya-002 (refusing to block a clean repo) and zofia-002 (refusing to write a
  duplicate rule). Nadia's is the refusal to RECOMMEND A CHANGE.

  Why it exists. nadia-001 is detection: it tests that she diagnoses a miss and
  names its mechanism. But she holds Edit/Write and her output is a list of
  prompt edits, so her consequential failure is recommending one when the agent
  was right. She has done the correct thing once in a real run — on nadia-001
  she wrote "The agent honoured its contract item-for-item and still did not
  answer the question. That makes this a prompt defect, not an agent defect."
  That was a prompt defect. Nothing tested the case where it is a CRITERION
  defect and the answer is to change nothing about the agent at all.

  The situation is taken from this repository's own history rather than
  invented. `tomas-lindgren`'s contract says, in as many words, "Do not
  recommend pinning a transitive dependency unless the project can verify the
  pin." The run refuses exactly that, gives the reason, and proposes the test
  that would make a pin meaningful. The criterion it was graded against carries
  the guard `"pin the transitive dependency"` — an imperative — so the correct
  refusal ("I do not recommend pinning the transitive dependency `certifi`")
  contains the guard and fires it. Thirty-one guards of that shape were found in
  this suite on 2026-08-05; this fixture is that lesson, pointed back at the
  agent whose job is to tell the difference.

  PASS BAR: the report identifies the guard as the defect and recommends no
  change to the agent's prompt. The strong pass also notes that the guard
  contradicts the contract it is supposed to be testing — the contract mandates
  the refusal that the guard punishes.

  DECLARED DEFECTS, all real, none required for a pass:
    1. The guard is imperative, so a correct refusal trips it.
    2. The guard contradicts `agent_contract.md`, which mandates that refusal.
    3. Nothing in `expected` rewards the refusal at all, so an agent that
       recommended the pin outright would have scored better than one that
       correctly declined.

  Verified by the author before shipping: the guard string appears verbatim in
  both the criteria file and the transcript, which is what makes the FAIL
  reproducible from the input alone; the contract's refusal clause and the guard
  are checked against each other and do contradict; guards graded against the
  correct report's denial in both infixed and external forms (rule 25).

  Not yet run against the agent.

  Run (2026-08-27, dispatched, scoped to a staged copy): VOID — grader false positive, no verdict.
  cmd_grade voided the report for containing "case.yaml". Nadia wrote
  `evals/cases/tomas-004/case.yaml:20` in her recommended-changes table — the canonical path of the
  FICTIONAL case she was asked to review — and annotated it "(staged here as `case_criteria.yaml:20`)",
  showing she knew she was reading a staged copy. Recommending a criterion edit REQUIRES naming the file
  the edit lands in, so a correct report cannot avoid the term.
  This is the second instance of the class PF-011 already records for this fixture. The 2026-08-05 fix
  drops a void-term that appears in the case's own input/; "must_not_find" appears there (2 files) and was
  correctly dropped, but "case.yaml" does not, so it still fires. The detector needs to tolerate a path
  ending in case.yaml that is not THIS case's own — or this fixture needs its scenario file renamed.
  On the substance she reached the intended answer: Hit for the agent, criterion defect at
  case_criteria.yaml:20, because the guard is an imperative the correct refusal necessarily contains.

  Re-graded (2026-08-27) after the VOID was diagnosed as a grader false positive
  and fixed: FAIL — 5 criteria, 1 failed. Criteria 2 and 4 both PASS (matched
  "guard" and "not an agent defect"); the location criterion on
  case_criteria.yaml:18-22 PASSES. The single failure is criterion 3, whose
  any_of is "honoured its contract" / "honored its contract" / "followed its
  contract" / "the agent was right" / "correct refusal".

  The report SAYS this, in different words: verdict "Hit", and "tomas-lindgren
  covered 8 of 8 contract items with 0 cardinal-rule violations". So criterion 3
  is the ENUMERATED-PARAPHRASE defect evals/README.md names — an any_of list of
  full clauses that cannot be exhaustive — and it is the fifth recorded instance
  of that class.

  NOT PATCHED HERE, deliberately. Rule 25 warns against weakening a bar so it
  passes, and this fixture's entire subject is distinguishing an agent defect
  from a criterion defect; quietly loosening its own criterion while it is the
  thing under test would be the exact error it exists to catch. Two options for
  whoever takes it:
    a. criterion 3 is redundant with criterion 4, which already requires the
       report to absolve the agent, and could be dropped; or
    b. it is re-anchored on the shortest distinctive token a correct verdict
       must contain. Note that the obvious candidate, the bare word "hit" from
       her Outcome line, is UNSAFE: "hit" is a substring of "white" and
       "architect", so Check 30's sibling failure mode applies.
  The agent's substantive answer was correct either way: Hit for the agent,
  criterion defect at case_criteria.yaml:20, because the guard is an imperative
  a correct refusal necessarily contains.

