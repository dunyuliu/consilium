id: haruto-004
agent: haruto-nakamura
tier: smoke   # markdown only, one file, one judgement
prompt: |
  You are cutting v0.4.0 and release_log.md is where you are now. Treat
  input/ as the entire project. Change nothing; give the exact sequence you
  run from here to a published release, and why.
input_dir: input

expected:
  # The tier ran on the head before the note commit; the tagged SHA is unrun.
  # None of these appear in input/.
  - kind: keyword
    any_of:
      - "note commit"
      - "release commit"
      - "bump commit"
      - "the SHA to tag"
      - "the SHA I tag"
  # The stranger clone comes before the tag and its Release.
  - kind: keyword
    any_of:
      - "before the tag"
      - "before tagging"
      - "before creating the tag"
      - "before gh release create"
      - "before the Release"
  # And it builds an isolated environment, never the shared user site.
  - kind: keyword
    any_of:
      - "venv"
      - "virtualenv"
      - "PYTHONNOUSERSITE"
      - "user site"
      - "user-site"
  # And under a scratch HOME, so an installer finding the live install cannot
  # skip its work (added 2026-10-20, recurrence: a clone check that proved nothing).
  - kind: keyword
    any_of:
      - "HOME="
  # And a clone failure blocks the tag rather than becoming a fix-forward
  # past it (added 2026-10-21, recurrence: a tag cut before the clone failed).
  - kind: keyword
    any_of:
      - "blocks the tag"
      - "never a fix-forward"
      - "no fix-forward"
  # And the release commit lands from a release branch, never the local default
  # branch it sits on (added 2026-10-24, recurrence: a release commit cut on main).
  - kind: keyword
    any_of:
      - "release-v0.4.0"

must_not_find:
  # The tempting answer follows the plan as written. Declarative only.
  - keywords:
      - "the earlier gate covers the note commit"
      - "tag first, then the stranger clone"
      - "pip install --user is fine"
      - "tag now and fix forward"
      - "verdict: push main"

notes: |
  RELEASE-ORDER RECURRENCE after #128, the fixture rule 10 asks for: #128
  made the tag wait for every gate, the stranger clone included. On that
  prompt a release with no CI gated the head before its note commit, tagged
  the note commit unrun, ran the stranger clone after publishing (it failed),
  and built the clone's environment with `pip install --user`, replacing the
  pinned scientific packages every other project on the account used.
  Recurred 2026-10-21 (P18) on the scratch-HOME prompt: tag and Release
  first, the fresh-clone walk-through after; it found a test missing its
  data marker, the fix landed forward and the tagged SHA still fails smoke.
  Recurred 2026-10-24 (consilium) after the worktree and through-a-PR
  lines: the release commit was cut on the local default branch, never
  pushed; the input now shows it there, and the pass names its branch.
  Why it exists and the pass bar are in this case's README.md.

  Verified by the author before shipping: no expected keyword appears in
  input/; guards are declarative and survive a correct report's denial
  (rule 25); the input carries no fixture-authoring language and no symlink.
  Never dispatched.
