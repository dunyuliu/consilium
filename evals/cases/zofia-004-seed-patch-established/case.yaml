id: zofia-004
agent: zofia-kaminska
tier: smoke   # fast, markdown only, and the only test of Mode A on an established project
prompt: |
  Seed this project. Report the seed you would write: for each of README.md,
  CLAUDE.md, PROJECT_RULES.md and a status board, say whether it is absent,
  present under another name, or present — and what you would do for each.
  Treat input/ as the entire project; the paths you have are the paths
  there are.
input_dir: input

expected:
  # Recognizes PROJECT_RULES.md is PRESENT, not absent -- the whole point of
  # this fixture versus zofia-003, whose project has no rule book at all.
  # The prompt's own vocabulary is "absent / present under another name /
  # present" (case.yaml:6-7), so a table-format report that writes
  # "| `PROJECT_RULES.md` | **present** | ..." must pass on that word, not
  # only on "exists" -- these terms pair the filename with the verdict word
  # so a hollow "present" appearing elsewhere in the report cannot match.
  - kind: keyword
    any_of:
      - "PROJECT_RULES.md already exists"
      - "PROJECT_RULES.md exists"
      - "the rule book already exists"
      - "an existing rule book"
      - "PROJECT_RULES.md` | **present**"
      - "PROJECT_RULES.md | present"
      - "PROJECT_RULES.md** | present"
      - "PROJECT_RULES.md is present"
      - "PROJECT_RULES.md: present"
    severity: critical
  # New rules land at the next free number (6), never renumbering 1-5. This is
  # the "enhance, never revamp" instruction applied to a project that already
  # has rules.
  - kind: keyword
    any_of:
      - "rule 6"
      - "as rule 6"
      - "next free number"
      - "at the next free number"
  # README.md and CLAUDE.md are PRESENT with real content; the correct move is
  # to leave them alone, not regenerate them from the starter set. A
  # table-format report states this per-file, filename and verdict landing in
  # separate cells of the same row -- so the table terms below reproduce the
  # literal row text (filename + the "present" status the other criterion
  # above already established + the leave-alone action), not a bare
  # "leave content untouched" that names no file and would pass anywhere in
  # the report. grep -F is plain-substring, so it cannot express "these two
  # facts, same row, whatever sits between them" -- only the exact phrasing a
  # correct table happens to use. That is a named limit, not a design goal:
  # a two-column table, or one that skips the word "present", will miss this
  # criterion and is not covered here.
  - kind: keyword
    any_of:
      - "README.md is left alone"
      - "leave README.md as is"
      - "README.md untouched"
      - "README.md stays as is"
      - "CLAUDE.md is left alone"
      - "leave CLAUDE.md as is"
      - "CLAUDE.md untouched"
      - "CLAUDE.md stays as is"
      - "README.md` | **present** | leave"
      - "README.md | present | leave"
      - "README.md** | present | leave"
      - "README.md: present | leave"
      - "CLAUDE.md` | **present** | leave"
      - "CLAUDE.md | present | leave"
      - "CLAUDE.md** | present | leave"
      - "CLAUDE.md: present | leave"
  # The board is genuinely absent and gets created -- but never as an empty
  # template. It must be seeded from the project's ALREADY-KNOWN open issues,
  # which live in README.md's "Known issues" section, not invented.
  - kind: keyword
    any_of:
      - "CSV importer"
      - "encoding"
  - kind: keyword
    any_of:
      - "windows path handling"
      - "windows paths"

must_not_find:
  # The anti-pattern this fixture exists to catch: treating "seed" as license
  # to replace what is already there. Declarative verdict shapes a correct
  # report never has reason to write, even to deny.
  - keywords:
      - "PROJECT_RULES.md is rewritten"
      - "the rule book is replaced"
      - "starter rule 1 replaces rule 1"
      - "existing rules are renumbered"
      - "rules 1 through 5 are renumbered"
  - keywords:
      - "README.md is rewritten"
      - "README.md is replaced"
      - "CLAUDE.md is rewritten"
      - "CLAUDE.md is replaced"
  # Never an empty template -- Mode A's own words.
  - keywords:
      - "the board ships as an empty template"
      - "seeded as an empty template"
      - "left blank for the user to fill in"

declared_defects:
  # Real gaps in this established project a thorough seed would react to,
  # whether or not required for a pass.
  - kind: keyword
    file: rule-book-has-no-board-invariant
    any_of:
      - "no board"
      - "status board"
      - "invariant 12"
  - kind: keyword
    file: rule-5-gate-is-unenforceable-as-written
    any_of:
      - "CI pipeline is not built"
      - "rule 5"
      - "unenforceable"

notes: |
  Origin: PF-017. `agents/zofia-kaminska.md`'s seeding path collapsed to a
  single flow that no longer branches on repo state -- Mode A's own table
  ("absent -> create", "present under another name -> propose rename",
  "present -> leave alone, patch in") covers exactly this, but
  `zofia-003-seed-bare-project` only exercises the ABSENT column: its input
  has no README.md, no CLAUDE.md, no PROJECT_RULES.md at all. Nothing in the
  suite had ever put an established project — one that already has a rule
  book, a README and a CLAUDE.md, all with real content — in front of her.

  The trap: PROJECT_RULES.md here already has five real, well-formed rules
  (1-5). A run that pattern-matches "seed the project" to "write the starter
  twelve" will renumber or overwrite them wholesale — exactly the revamp Mode
  A forbids. README.md and CLAUDE.md are similarly real and complete; the
  correct move for both is silence, not regeneration. Only the status board is
  genuinely absent, and it must be seeded from the "Known issues" section
  README.md already carries — a fresh empty template would be the same
  degenerate case Step 0 exists to catch, on a different artifact.

  PASS BAR: identify PROJECT_RULES.md as PRESENT and add new rules starting at
  6 without renumbering 1-5; leave README.md and CLAUDE.md untouched; create
  the board from the two real known issues in README.md (CSV encoding,
  untested Windows paths), not from a blank template.

  Run (2026-09-16, via zofia-kaminska). FAIL — 8 criteria, 2 failed. The
  report used exactly the prompt's own vocabulary ("absent / present under
  another name / present", case.yaml:6-7) as a markdown table:
  "| `PROJECT_RULES.md` | **present** | ..." and "| `README.md` | **present**
  | leave content untouched — ..." / "| `CLAUDE.md` | **present** | leave the
  three sections untouched. ...". The two failing criteria required "exists"
  where the report correctly wrote "present", and required "README.md
  untouched" / "CLAUDE.md untouched" as one contiguous phrase where the
  report's table put the filename and the leave-alone verdict in separate
  cells. Both were criterion defects, not agent defects: the fixture asked
  for "present" and graded on "exists", and required adjacency a table
  cell structurally breaks.

  SUPERSEDED 2026-09-16 (Iris Vermeulen, PF-017 follow-up): the two failing
  `expected` criteria were rewritten to accept the prompt's own "present"
  vocabulary and per-file table phrasing ("PROJECT_RULES.md` | **present**",
  "leave content untouched", etc.) alongside the original prose phrasings.
  Because the criteria that produced the FAIL above no longer exist in this
  form, the FAIL verdict corresponds to no current grading and has no
  standing pass/fail claim against the criteria as they now read. The case
  must be re-dispatched against the corrected criteria before it has a live
  verdict again; this entry is kept, not deleted, per rule 5.

  RETURNED 2026-09-16 (gate review): the SUPERSEDED fix above landed two
  terms in the third `expected` block that name no file --
  "leave content untouched" and "leave the three sections untouched" -- so
  any sentence anywhere in a report containing either phrase satisfies the
  criterion, including one that also states "README.md is rewritten" /
  "PROJECT_RULES.md is rewritten" (demonstrated: `samples/fail.md` plus the
  single appended sentence "I will leave content untouched." dropped the
  case from 8 failed to 6 failed). "leave the three sections untouched" had
  a second defect independent of the coupling: "three sections" is a detail
  of the one sample graded, not an invariant of a correct answer.

  FIXED 2026-09-16 (Iris Vermeulen): both terms replaced with table-row
  literals that couple the filename to the leave-alone verdict the way
  `samples/pass.md`'s actual row reads ("README.md\` | **present** | leave
  content untouched", plus plain-pipe/bold-only/colon variants, and the
  CLAUDE.md equivalents). `grep -F` is plain-substring matching -- it cannot
  express "filename and verdict in the same row, whatever sits between
  them" -- so these terms reproduce the specific "present"-then-action
  phrasing this fixture's own samples use rather than a wildcard. Named
  limit, not silently patched: a two-column table, or one that states the
  status without the word "present", will not match this block. Verified:
  `samples/fail.md` + the hollow sentence above is FAIL again (7 failed,
  matching fail.md unmodified); `samples/pass.md` is PASS 8/8;
  `samples/fail.md` unmodified is FAIL 7 failed. Still SUPERSEDED pending
  re-dispatch per rule 5 -- this change moves where the criteria will be
  re-dispatched against, not the dispatch itself.
