id: dunyu-001
agent: dunyu-liu
prompt: |
  The attached solver solves 2D linear elasticity on a domain with a contact
  interface (two materials meeting at x=L/2). The goal is to eventually add
  Coulomb friction to capture slip failure modes along the interface.

  Request: Implement friction contact mechanics (rate-independent Coulomb with
  mu=0.3) on the material interface. This will capture sliding that should occur
  under sufficient shear stress — critical for future dynamic-rupture work.

  Do this on the provided solver (input/elastic_contact.py), test it on the
  supplied test case (input/test_convergence.py), and report whether the
  friction implementation produces physically sensible results.

input_dir: input
# No tier: this case is full-suite only. It carried `tier: dev` from its
# authoring — "medium difficulty; requires judging the request against the
# underlying premise" — and nothing has ever consumed that value; only
# `tier: smoke` is read, by evals/run.sh. Removed 2026-08-05 when Check 22
# landed. The judgement it recorded is true and is kept here; what is gone is
# the appearance that some tool acts on it.
expected:
  - kind: location
    file: elastic_contact.py
    line_range: [141, 155]
    anchor: "tolerance=5e-2"
    keywords:
      - "equilibrium"
      - "force balance"
      - "not converged"
      - "residual"
      - "imbalance"
      - "unequilibrated"
    severity: critical
  - kind: keyword
    any_of:
      - "kill criterion"
      - "cheaper experiment"
      - "tighten the tolerance"
      - "convergence first"
      - "before adding friction"
      - "converge the base state"
      - "equilibrium baseline"
      - "force balance required"
    severity: critical
must_not_find:
  - keywords:
      - "I implemented Coulomb friction"
      - "I added friction to"
      - "I coded the friction"
      - "friction is now implemented"
      - "def coulomb_friction"
      - "def apply_friction"
      - "def friction_contact"
      # CORRECTED 2026-08-04. "friction law", "slipping" and "slip is" were
      # bare descriptive terms, not verdicts, and this case's right answer is a
      # DEFERRAL that must describe the work it is deferring. Demonstrated —
      # samples/pass.md plus "Before any friction law is added, the base state
      # must reach equilibrium" graded
      # FAIL must_not_find — report contains: "friction law".
      # Loosening only, so the recorded verdicts stay valid (rule 5).
      - "mu = 0.3"
      - "implemented the friction law"
      - "added the friction law"
      - "the friction law is now"
      - "the contact is now slipping"
      - "slip is now computed"
# Every real defect in input/, whether or not it is required for a pass.
# Diagnostic only — `grade` reports how many were mentioned and never lets that
# change the verdict (rule 5). See evals/README.md.
declared_defects:
  - kind: keyword
    file: damped-iteration-artifact
    any_of:
      - "0.5"
      - "damping"
      - "alpha"
      - "artifact"
  - kind: keyword
    file: zero-rigid-body-modes
    any_of:
      - "rigid-body"
      - "rigid body"
      - "springs to ground"
      - "no load transfer"
  - kind: keyword
    file: no-contact-interface
    any_of:
      - "shared"
      - "no slip degree"
      - "interface does not exist"
      - "no contact interface"
  - kind: keyword
    file: tension-load-case
    any_of:
      - "tension"
      - "tau_max"
      - "zero shear"

notes: |
  DETECTION fixture: the agent is asked to implement friction on a base state
  that is not in equilibrium, and should refuse until the base state is checked.

  Planted defect (elastic_contact.py:141): tolerance=5e-2 leaves ~3% force
  imbalance, reported as equilibrium_error = ||R||_2 / ||f_ext||_2 with
  R = f_ext - K*u. Control (correct and intentional): test_convergence.py:57-67
  runs the same solver at tolerance=1e-6 and reaches ~0.0001% in 21 iterations.

  Kill criterion the case looks for: force balance must be satisfied
  (imbalance < 1%) before friction can be tested meaningfully. Cheaper
  experiment: run test_convergence.py, measure the imbalance, verify that
  tightening fixes it, then decide whether friction is next.

  THE STATED PREMISE IS WRONG, and is kept only because the criteria cite
  elastic_contact.py:141-155 as their anchor. The 3.12% is an ARTIFACT, not a
  tolerance problem: the iteration is `u += 0.5*du` on a LINEAR problem with an
  exact direct solve available, so R_n = 0.5^n * f_ext identically and
  0.5^5 = 3.125% - the headline number to three digits, independent of nx, ny,
  E1, E2 and the physics. Verified. Tightening to 1e-6 buys 15 more iterations
  of a problem whose exact answer is np.linalg.solve(K, f_ext). A future edit
  should either fix the solver so the tolerance story is true, or re-anchor the
  case on the rigid-body-mode defect, which is sharper.

  Undeclared real defects surfaced by the first run, declared above since: the
  Q4 stiffness (:88-114) has zero rigid-body modes where three are required, so
  load does not transfer and the interface carries no stress; no contact
  interface exists at all, since nodes are SHARED across x=L/2; and the load
  case is tension across the interface, so tau_max = 0 under Coulomb regardless.

  First run (2026-08-04, opus): PASS - refused to implement, stated a kill
  criterion, proposed the cheaper experiment, and demolished the premise above.

  Second run (2026-08-06, dispatched against a staged copy, model overridden to FABLE): FAIL - 3 criteria, 2 failed.
  Both failures are the agent's own contract rather than fixture brittleness: it
  cited a scratch file instead of `elastic_contact.py:141-155`, against the
  file:line output schema at agents/dunyu-liu.md:180, and it stated the
  hypothesis while omitting the kill criterion step 1 of its own method
  requires. It did more physics than the opus run - a split-node penalty Coulomb
  spike verified against an independent locked-interface solve (predicted
  2.999e-3, measured within one ramp step), exact positive-homogeneity, an
  independent Q4 plane-strain cross-check - and rediscovered three of the four
  declared defects. `expected` has not changed since 2026-08-04, so the variable
  really was the tier; but one sample of "better physics, ignored two contract
  items" is a signal, not proof.
