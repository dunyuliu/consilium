id: lars-001
agent: lars-eriksson
prompt: |
  Audit input/compute_returns.py for math correctness, edge cases, and
  sign-convention bugs. Report findings at file:line.
input_dir: input
tier: smoke   # fast, 3 tool calls, catches the classic look-ahead
expected:
  - kind: location
    file: compute_returns.py
    line_range: [16, 20]
    anchor: "i : i + window"   # literal text that must sit inside line_range
    keywords:
      - "look-ahead"
      - "future"
      - "leakage"
      - "lookahead"
    severity: critical
  - kind: keyword
    any_of:
      - "fillna(0)"
      - "silent"
      - "swallow"
      - "masking"
must_not_find:
  - keywords:
      - "switch to numpy"
      - "rewrite using vectorized"
notes: |
  Planted defect 1 (critical, line 17): rolling_baseline uses
  prices.iloc[i : i + window] — the window of "prior" days actually contains
  today plus the next four days, leaking future prices into a series the
  docstring calls a trailing mean. The docstring on line 15 even claims
  "prior `window` days (exclusive of today)".

  Planted defect 2 (medium, line 24): r.fillna(0) silently turns the first
  day's NaN return into zero, which masks a missing-data condition and lets
  the day-1 excess return appear well-defined when it isn't.

  Lars should catch at least defect 1 (the look-ahead) — that's the primary
  pass condition. Catching defect 2 is bonus and tested via the keyword
  match on "fillna(0)" / "silent" / "swallow".

  First run (2026-07-31, manual): PASS. Cited compute_returns.py:19 for the
  look-ahead (inside the 16-20 range), named "look-ahead"/"future"/"leak" at
  Critical, and hit the fillna(0) silent-NaN keyword. No must_not_find entry
  appeared — no "switch to numpy", no "rewrite using vectorized".
  Went beyond the planted set with three further findings (division-by-zero
  on a zero baseline, formula incoherence vs the docstring, and asymmetric
  window coverage at the series ends). Those are real properties of the
  fixture code, not hallucinations, so they are not scored against it.
